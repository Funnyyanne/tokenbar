[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenbar"
version = "0.2.0"
description = "Local-first token and rate-limit status bar for AI CLI tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anneluo"}]
dependencies = []

[project.scripts]
tokenbar = "ai_cli_statusline.cli:main"
ai-cli-statusline = "ai_cli_statusline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
